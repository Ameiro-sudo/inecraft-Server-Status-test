<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 · SnowBlock</title>
    <link rel="stylesheet" href="assets/vendor/fonts/ZCOOL_KuaiLe.css">
    <link rel="stylesheet" href="assets/vendor/font-awesome@6.5.1/css/all.min.css">
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div id="loader">
        <div class="loader-crystal">
            <div class="crystal-wrapper">
                <div class="crystal-glow"></div>
                <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path class="main-line" stroke-width="2.2" stroke-linecap="round" fill="none"
                          d="M50 5 L50 95
                             M50 5 L75 25 L50 50
                             M50 5 L25 25 L50 50
                             M50 95 L75 75 L50 50
                             M50 95 L25 75 L50 50
                             M50 50 L95 50
                             M75 25 L95 50
                             M25 25 L5 50
                             M75 75 L95 50
                             M25 75 L5 50" />
                    <path class="inner-line" stroke-width="1.4" stroke-linecap="round" fill="none"
                          d="M50 15 L50 85
                             M50 15 L65 30 L50 50
                             M50 15 L35 30 L50 50
                             M50 85 L65 70 L50 50
                             M50 85 L35 70 L50 50
                             M50 50 L85 50
                             M65 30 L85 50
                             M35 30 L15 50
                             M65 70 L85 50
                             M35 70 L15 50" />
                    <path class="core-line" stroke-width="1.8" stroke-linecap="round" fill="none"
                          d="M50 38 L50 62
                             M50 38 L57 44 L50 50
                             M50 38 L43 44 L50 50
                             M50 62 L57 56 L50 50
                             M50 62 L43 56 L50 50
                             M50 50 L62 50
                             M57 44 L62 50
                             M43 44 L38 50
                             M57 56 L62 50
                             M43 56 L38 50" />
                </svg>
            </div>
            <div class="loader-text-frost"><i class="fa-solid fa-snowflake"></i> 正在连接雪境</div>
            <div class="loader-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="login-container">
        <h1>管理员登录</h1>
        <div class="error" id="loginError" style="display:none;"></div>
        <form onsubmit="return false;">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">登录</button>
        </form>
        <p style="text-align:center;margin-top:1rem;color:var(--text-muted);font-size:0.8rem;">默认账号 admin · 可在管理面板修改密码</p>
        <p style="text-align:center;margin-top:1rem;"><a href="index.html" style="color:var(--text-muted);font-size:0.8rem;">返回主页</a></p>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/servers.js"></script>
    <script src="assets/js/admin-config.js"></script>
    <script>
    app.login = app.login || {};
    var loginBtn = document.getElementById('loginBtn');

    loginBtn.addEventListener('click', function() {
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value;
        var err = document.getElementById('loginError');

        function fail(t) {
            err.textContent = t;
            err.style.display = 'block';
            loginBtn.disabled = false;
        }

        if (!u || !p) { fail('请输入用户名和密码'); return; }

        var cred = AdminConfig.credentials();
        if (cred.passwordHash && !AdminConfig.shaAvailable()) {
            fail('当前环境不支持安全登录(请通过 HTTPS 访问)');
            return;
        }

        loginBtn.disabled = true;
        AdminConfig.verify(u, p).then(function(ok) {
            if (!ok) { fail('用户名或密码错误'); return; }
            sessionStorage.setItem('admin_logged_in', '1');
            var from = new URLSearchParams(location.search).get('from');
            if (from && /^[\w.-]+\.html$/.test(from)) window.location.href = from;
            else window.location.href = 'admin.html';
        }).catch(function() {
            fail('登录校验失败, 请重试');
        });
    });

    document.getElementById('username').addEventListener('keydown', function(e) { if (e.key === 'Enter') loginBtn.click(); });
    document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') loginBtn.click(); });
    </script>
</body>
</html>
