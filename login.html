<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 · SnowBlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>#loader{display:flex;position:fixed;inset:0;z-index:9999}</style>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div id="loader">
        <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8fd8ef"/>
                    <stop offset="100%" stop-color="#4a90d9"/>
                </linearGradient>
                <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#a8e6cf"/>
                    <stop offset="100%" stop-color="#8fd8ef"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.8">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,15 85,30 85,70 50,85 15,70 15,30" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.6">
                <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,25 75,35 75,65 50,75 25,65 25,35" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4">
                <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
            </polygon>
            <circle cx="50" cy="50" r="8" fill="url(#g1)" opacity="0.6">
                <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>
        <div class="loader-text-frost">SnowBlock</div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="login-container">
        <h1>管理员登录</h1>
        <div class="error" id="loginError" style="display:none;"></div>
        <form onsubmit="return false;">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="任意密码" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">登录</button>
        </form>
        <p style="text-align:center;margin-top:1rem;"><a href="index.html" style="color:rgba(200,235,250,0.5);font-size:0.8rem;">返回主页</a></p>
    </div>
    <script src="assets/js/app.js"></script>
    <script>
    app.login = app.login || {};
    document.getElementById('loginBtn').addEventListener('click', function() {
        var u = document.getElementById('username').value;
        var p = document.getElementById('password').value;
        if (!u || !p) {
            document.getElementById('loginError').textContent = '请输入用户名和密码';
            document.getElementById('loginError').style.display = 'block';
            return;
        }
        if (u === 'admin') {
            sessionStorage.setItem('admin_logged_in', '1');
            window.location.href = 'admin.html';
        } else {
            document.getElementById('loginError').textContent = '用户名不存在（演示环境用户名: admin）';
            document.getElementById('loginError').style.display = 'block';
        }
    });
    document.getElementById('username').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    </script>
</body>
</html>
