<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API管理 · SnowBlock</title>
    <meta name="description" content="SnowBlock MC 状态站 API 提供商管理 — 切换 mcstatus.io / mcsrvstat.us 等数据源">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2efe9">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b2b3b">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/webp" href="https://avatars.githubusercontent.com/u/269375186?v=4">
    <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/269375186?v=4">
    <link rel="stylesheet" href="assets/vendor/fonts/ZCOOL_KuaiLe.css">
    <link rel="stylesheet" href="assets/vendor/font-awesome@6.5.1/css/all.min.css">
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-page">
    <div id="loader">
        <div class="loader-crystal">
            <div class="crystal-wrapper">
                <div class="crystal-glow"></div>
                <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path class="main-line" stroke-width="2.2" stroke-linecap="round" fill="none"
                          d="M50 5 L50 95
                             M50 5 L75 25 L50 50
                             M50 5 L25 25 L50 50
                             M50 95 L75 75 L50 50
                             M50 95 L25 75 L50 50
                             M50 50 L95 50
                             M75 25 L95 50
                             M25 25 L5 50
                             M75 75 L95 50
                             M25 75 L5 50" />
                    <path class="inner-line" stroke-width="1.4" stroke-linecap="round" fill="none"
                          d="M50 15 L50 85
                             M50 15 L65 30 L50 50
                             M50 15 L35 30 L50 50
                             M50 85 L65 70 L50 50
                             M50 85 L35 70 L50 50
                             M50 50 L85 50
                             M65 30 L85 50
                             M35 30 L15 50
                             M65 70 L85 50
                             M35 70 L15 50" />
                    <path class="core-line" stroke-width="1.8" stroke-linecap="round" fill="none"
                          d="M50 38 L50 62
                             M50 38 L57 44 L50 50
                             M50 38 L43 44 L50 50
                             M50 62 L57 56 L50 50
                             M50 62 L43 56 L50 50
                             M50 50 L62 50
                             M57 44 L62 50
                             M43 44 L38 50
                             M57 56 L62 50
                             M43 56 L38 50" />
                </svg>
            </div>
            <div class="loader-text-frost"><i class="fa-solid fa-snowflake"></i> 正在连接雪境</div>
            <div class="loader-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="admin-container">
        <div class="header">
            <h1>API管理</h1>
            <div class="nav-links">
                <a href="admin.html" class="nav-btn">← 返回管理页面</a>
            </div>
        </div>

        <div class="success" id="msg" style="display:none;"></div>

        <h2>选择API</h2>
        <form onsubmit="return false;" class="form-container">
            <div class="form-group">
                <label for="javaApi">Java版服务器API:</label>
                <select id="javaApi">
                    <option value="mcstatus">api.mcstatus.io (默认)</option>
                    <option value="mcsrvstat">api.mcsrvstat.us</option>
                    <option value="mc6">MC6 原始API (HTTP)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="bedrockApi">基岩版服务器API:</label>
                <select id="bedrockApi">
                    <option value="mcstatus">api.mcstatus.io (默认)</option>
                    <option value="mcsrvstat">api.mcsrvstat.us 基岩</option>
                </select>
            </div>
            <button type="submit" class="btn" id="saveApiBtn">保存选择</button>
            <button type="submit" class="btn" style="background:var(--color-success-glow);color:var(--color-success);" id="fetchApiBtn">测试所选API连通性</button>
        </form>

        <h2>API信息</h2>
        <div class="api-list" id="apiInfoList"></div>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/servers.js"></script>
    <script src="assets/js/admin-config.js"></script>
    <script src="assets/js/status.js"></script>
    <script>
    app.requireAuth();
    app.apiMgmt = app.apiMgmt || {};

    function msg(text, isErr) {
        var m = document.getElementById('msg');
        m.className = isErr ? 'error' : 'success';
        m.textContent = text;
        m.style.display = 'block';
        setTimeout(function(){ m.style.display = 'none'; }, 4000);
    }

    function renderInfo() {
        var html = '';
        var order = ['java', 'bedrock'];
        var titles = { java: 'Java版API', bedrock: '基岩版API' };
        order.forEach(function (type) {
            html += '<h3 style="font-family:var(--font-title);font-weight:400;color:var(--text-secondary);margin:1rem 0 0.6rem;">' + titles[type] + '</h3>';
            var current = AdminConfig.api(type);
            Object.keys(mcStatus.PROVIDERS).forEach(function (key) {
                if (type === 'bedrock' && key === 'mc6') return; // mc6 仅提供 Java
                var p = mcStatus.PROVIDERS[key];
                var url = p.base[type] || '';
                var active = key === current;
                html += '<div class="api-item">' +
                    '<div class="api-info" style="font-weight:600;">' + app.esc(p.label) +
                        (active ? ' <span style="color:var(--color-success);font-size:0.75rem;">(当前使用)</span>' : '') + '</div>' +
                    '<div class="api-info"><small>' + app.esc(url) + '</small></div>' +
                    (key === 'mc6' ? '<div class="api-info"><small style="color:var(--status-warning);">注意: MC6 为 HTTP 接口, 站点部署为 HTTPS 时会被浏览器拦截</small></div>' : '') +
                '</div>';
            });
        });
        document.getElementById('apiInfoList').innerHTML = html;
    }

    document.getElementById('javaApi').value = AdminConfig.api('java');
    document.getElementById('bedrockApi').value = AdminConfig.api('bedrock');

    document.getElementById('saveApiBtn').addEventListener('click', function() {
        AdminConfig.saveApi(
            document.getElementById('javaApi').value,
            document.getElementById('bedrockApi').value
        );
        renderInfo();
        msg('API 选择已保存, 主页将在下次轮询时生效');
    });

    document.getElementById('fetchApiBtn').addEventListener('click', function() {
        var srv = AdminConfig.servers()[0];
        if (!srv) { msg('请先在"服务器管理"中添加服务器再测试', true); return; }
        msg('正在测试: ' + srv.address + (srv.port ? ':' + srv.port : '') + ' ...');
        mcStatus.fetchStatus(srv).then(function(st) {
            msg('测试成功: ' + (st.online ? '在线 ' + st.players + '/' + st.max + ' 人' : '离线'));
        }).catch(function() {
            msg('测试失败: ' + srv.address + ' 无法连接(检查网络或所选API可用性)', true);
        });
    });

    renderInfo();
    </script>
</body>
</html>
