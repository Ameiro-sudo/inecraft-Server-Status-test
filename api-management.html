<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API管理 · SnowBlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>#loader{display:flex;position:fixed;inset:0;z-index:9999}</style>
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-page">
    <div id="loader">
        <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8fd8ef"/>
                    <stop offset="100%" stop-color="#4a90d9"/>
                </linearGradient>
                <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#a8e6cf"/>
                    <stop offset="100%" stop-color="#8fd8ef"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.8">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,15 85,30 85,70 50,85 15,70 15,30" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.6">
                <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,25 75,35 75,65 50,75 25,65 25,35" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4">
                <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
            </polygon>
            <circle cx="50" cy="50" r="8" fill="url(#g1)" opacity="0.6">
                <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>
        <div class="loader-text-frost">SnowBlock</div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="admin-container">
        <div class="header">
            <h1>API管理</h1>
            <div class="nav-links">
                <a href="admin.html" class="nav-btn">← 返回管理页面</a>
            </div>
        </div>

        <div class="success" id="msg" style="display:none;"></div>

        <h2>选择API</h2>
        <form onsubmit="return false;" class="form-container">
            <div class="form-group">
                <label for="javaApi">Java版服务器API:</label>
                <select id="javaApi">
                    <option value="https://api.mcsrvstat.us/2/">mcapi.us (默认)</option>
                    <option value="http://cow.mc6.cn:10709/raw/">MC6 原始API</option>
                </select>
            </div>
            <div class="form-group">
                <label for="bedrockApi">基岩版服务器API:</label>
                <select id="bedrockApi">
                    <option value="https://api.mcsrvstat.us/bedrock/3/">mcapi.us 基岩 (默认)</option>
                </select>
            </div>
            <button type="submit" class="btn" id="saveApiBtn">保存选择</button>
            <button type="submit" class="btn" style="background:var(--color-success-glow);color:var(--color-success);" id="fetchApiBtn">获取API最新信息</button>
        </form>

        <h2>API信息</h2>
        <div class="api-list">
            <h3 style="font-family:var(--font-title);font-weight:400;color:var(--text-secondary);margin:1rem 0 0.6rem;">Java版API</h3>
            <div class="api-item">
                <div class="api-info" style="font-weight:600;">mcapi.us</div>
                <div class="api-info"><small>https://api.mcsrvstat.us/2/</small></div>
                <div class="api-website" style="margin-top:0.4rem;"><a href="https://mcsrvstat.us" target="_blank" style="color:var(--color-accent);font-size:0.85rem;">官方网站</a></div>
            </div>
            <div class="api-item">
                <div class="api-info" style="font-weight:600;">MC6 原始API</div>
                <div class="api-info"><small>http://cow.mc6.cn:10709/raw/</small></div>
            </div>

            <h3 style="font-family:var(--font-title);font-weight:400;color:var(--text-secondary);margin:1rem 0 0.6rem;">基岩版API</h3>
            <div class="api-item">
                <div class="api-info" style="font-weight:600;">mcapi.us 基岩</div>
                <div class="api-info"><small>https://api.mcsrvstat.us/bedrock/3/</small></div>
                <div class="api-website" style="margin-top:0.4rem;"><a href="https://mcsrvstat.us" target="_blank" style="color:var(--color-accent);font-size:0.85rem;">官方网站</a></div>
            </div>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
    <script>
    app.requireAuth();
    app.apiMgmt = app.apiMgmt || {};
    document.getElementById('saveApiBtn').addEventListener('click', function() {
        var m = document.getElementById('msg');
        m.textContent = 'API选择已保存 (演示)';
        m.style.display = 'block';
        setTimeout(function(){ m.style.display = 'none'; }, 3000);
    });
    document.getElementById('fetchApiBtn').addEventListener('click', function() {
        var m = document.getElementById('msg');
        m.textContent = 'API信息已更新 (演示)';
        m.style.display = 'block';
        setTimeout(function(){ m.style.display = 'none'; }, 3000);
    });
    </script>
</body>
</html>
