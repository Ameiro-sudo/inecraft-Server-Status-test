<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API调用日志 · SnowBlock</title>
    <link rel="stylesheet" href="assets/vendor/fonts/ZCOOL_KuaiLe.css">
    <link rel="stylesheet" href="assets/vendor/font-awesome@6.5.1/css/all.min.css">
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-page">
    <div id="loader">
        <div class="loader-crystal">
            <div class="crystal-wrapper">
                <div class="crystal-glow"></div>
                <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path class="main-line" stroke-width="2.2" stroke-linecap="round" fill="none"
                          d="M50 5 L50 95
                             M50 5 L75 25 L50 50
                             M50 5 L25 25 L50 50
                             M50 95 L75 75 L50 50
                             M50 95 L25 75 L50 50
                             M50 50 L95 50
                             M75 25 L95 50
                             M25 25 L5 50
                             M75 75 L95 50
                             M25 75 L5 50" />
                    <path class="inner-line" stroke-width="1.4" stroke-linecap="round" fill="none"
                          d="M50 15 L50 85
                             M50 15 L65 30 L50 50
                             M50 15 L35 30 L50 50
                             M50 85 L65 70 L50 50
                             M50 85 L35 70 L50 50
                             M50 50 L85 50
                             M65 30 L85 50
                             M35 30 L15 50
                             M65 70 L85 50
                             M35 70 L15 50" />
                    <path class="core-line" stroke-width="1.8" stroke-linecap="round" fill="none"
                          d="M50 38 L50 62
                             M50 38 L57 44 L50 50
                             M50 38 L43 44 L50 50
                             M50 62 L57 56 L50 50
                             M50 62 L43 56 L50 50
                             M50 50 L62 50
                             M57 44 L62 50
                             M43 44 L38 50
                             M57 56 L62 50
                             M43 56 L38 50" />
                </svg>
            </div>
            <div class="loader-text-frost"><i class="fa-solid fa-snowflake"></i> 正在连接雪境</div>
            <div class="loader-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="admin-container">
        <div class="header">
            <h1>API调用日志</h1>
            <div class="nav-links">
                <a href="admin.html" class="nav-btn">服务器管理</a>
                <a href="api-management.html" class="nav-btn">API管理</a>
                <a href="index.html" class="nav-btn">返回首页</a>
                <button type="button" class="nav-btn danger" id="clearLogBtn">清空日志</button>
            </div>
        </div>
        <div class="log-list" id="logList"></div>
        <p class="modal-note" id="logEmpty" style="display:none;">* 暂无日志 — 主页每 60s 自动轮询并记录真实调用结果</p>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/servers.js"></script>
    <script src="assets/js/admin-config.js"></script>
    <script>
    app.requireAuth();
    app.logs = app.logs || {};

    function render() {
        var logs = AdminConfig.loadLogs();
        var list = document.getElementById('logList');
        var empty = document.getElementById('logEmpty');
        if (!logs.length) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        list.innerHTML = logs.slice().reverse().map(function(l) {
            return '<div class="log-entry-line"><span class="log-time">' + app.esc(l.time) + '</span><span class="log-message">' + app.esc(l.msg) + '</span></div>';
        }).join('');
    }

    document.getElementById('clearLogBtn').addEventListener('click', function() {
        if (!confirm('确定要清空所有日志吗？')) return;
        AdminConfig.clearLogs();
        render();
    });

    render();
    setInterval(render, 5000);
    </script>
</body>
</html>
