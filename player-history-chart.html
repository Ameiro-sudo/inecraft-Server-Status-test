<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线人数历史 · SnowBlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>#loader{display:flex;position:fixed;inset:0;z-index:9999}</style>
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="loader">
        <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8fd8ef"/>
                    <stop offset="100%" stop-color="#4a90d9"/>
                </linearGradient>
                <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#a8e6cf"/>
                    <stop offset="100%" stop-color="#8fd8ef"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.8">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,15 85,30 85,70 50,85 15,70 15,30" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.6">
                <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
            </polygon>
            <polygon points="50,25 75,35 75,65 50,75 25,65 25,35" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4">
                <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
            </polygon>
            <circle cx="50" cy="50" r="8" fill="url(#g1)" opacity="0.6">
                <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>
        <div class="loader-text-frost">SnowBlock</div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="install-container chart-standalone">
        <header class="page-header">
            <h1>在线人数历史记录</h1>
            <p class="sub">浏览器本地采样 · 保留 7 天</p>
        </header>

        <div class="chart-controls" style="gap:1rem;flex-wrap:wrap;">
            <div class="control-group">
                <label for="serverSelect">选择服务器:</label>
                <select id="serverSelect" class="date-input"></select>
            </div>
            <div class="control-group">
                <label>查看模式:</label>
                <select id="viewMode" class="date-input">
                    <option value="aggregated">聚合数据(按天)</option>
                    <option value="raw">原始数据(按时段)</option>
                </select>
            </div>
            <button id="refreshBtn" class="chart-btn" style="font-size:0.85rem;">刷新</button>
        </div>

        <div class="chart-wrapper" style="height:400px;">
            <canvas id="historyChart"></canvas>
        </div>

        <p class="modal-note" id="dataInfo">* 暂无本地采样数据,请先在主页停留让状态页采样</p>
        <p style="text-align:center;margin-top:1rem;"><a href="index.html" style="color:var(--color-accent);font-size:0.8rem;">返回主页</a></p>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/servers.js"></script>
    <script src="assets/js/status.js"></script>
    <script>
    app.requireAuth();
    var chart = null;

    var select = document.getElementById('serverSelect');
    SERVERS.forEach(function (srv) {
        var opt = document.createElement('option');
        opt.value = srv.id;
        opt.textContent = srv.name;
        select.appendChild(opt);
    });

    function renderChart() {
        var sid = select.value;
        var mode = document.getElementById('viewMode').value;
        var hist = status.loadHistory(sid);
        var ctx = document.getElementById('historyChart');
        if (chart) chart.destroy();

        var series;
        if (hist.length) {
            series = mode === 'aggregated' ? status.aggregateByDay(hist) : status.aggregateByHour(hist);
        } else {
            series = { labels: [], values: [] };
        }

        if (!series.labels.length) {
            document.getElementById('dataInfo').textContent = '* 暂无本地采样数据,请在主页停留让状态页采样(每 60s 记录一点)';
            document.getElementById('dataInfo').style.color = 'var(--status-warning)';
            return;
        }

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: series.labels,
                datasets: [{
                    label: '在线人数',
                    data: series.values,
                    borderColor: '#8fd8ef',
                    backgroundColor: 'rgba(143,216,239,0.15)',
                    borderWidth: 2,
                    pointBackgroundColor: '#8fd8ef',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointRadius: 3,
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: 'var(--chart-tick)' } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { ticks: { color: 'var(--chart-tick)' }, grid: { color: 'var(--chart-grid)' } },
                    y: { beginAtZero: true, ticks: { color: 'var(--chart-tick)', stepSize: 1 }, grid: { color: 'var(--chart-grid)' } }
                }
            }
        });
        document.getElementById('dataInfo').textContent = '数据点: ' + hist.length + ' | 浏览器本地采样(每 60s 一点)';
        document.getElementById('dataInfo').style.color = '';
    }
    document.getElementById('serverSelect').addEventListener('change', renderChart);
    document.getElementById('viewMode').addEventListener('change', renderChart);
    document.getElementById('refreshBtn').addEventListener('click', renderChart);
    renderChart();
    </script>
</body>
</html>
