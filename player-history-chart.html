<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线人数历史 · SnowBlock</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>:root {
  --color-bg-deep: #0b2b3b;
  --color-accent: #8fd8ef;
  --glass-bg: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.20);
  --glass-hover-bg: rgba(255,255,255,0.22);
  --glass-header-bg: rgba(11,43,59,0.55);
  --shadow-card: 0 30px 60px -16px rgba(0,0,0,0.45);
  --shadow-item: 0 4px 16px -6px rgba(0,0,0,0.15);
  --shadow-toast: 0 8px 30px rgba(0,0,0,0.35);
  --radius-card: 3rem;
  --radius-item: 1.5rem;
  --font-mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --font-sans: 'Segoe UI',Roboto,'Helvetica Neue',system-ui,-apple-system,sans-serif;
  --font-title: 'ZCOOL KuaiLe',cursive,var(--font-sans);
  --radius-btn: 2rem;
  --body-pad: clamp(1.2rem,5.88vw,2.5rem);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  padding: var(--body-pad);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  background-color: #0b2b3b;
  background-image:
    url('https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/status/138936740_p0.webp'),
    linear-gradient(160deg,#0b2b3b,#162b36);
  background-size: cover, auto;
  background-position: center, 0;
  background-repeat: no-repeat, repeat;
  background-attachment: fixed, scroll;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.30);
  backdrop-filter: blur(2px);
  pointer-events: none;
  z-index: 0;
}

body > * { position: relative; z-index: 1; }

#snowCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 1.5s ease 0.5s;
}

#loader.hidden ~ #snowCanvas { opacity: 1; }

#loader {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg,#d4eaf7,#b8d8ee,#d4eaf7);
  background-size: 200% 200%;
  animation: loaderBgShift 6s ease infinite;
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease,visibility 0.5s ease,transform 0.5s ease;
}

@keyframes loaderBgShift {
  0%   { background-position: 0% 0%; }
  50%  { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}

#loader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(1.05);
}

.loader-crystal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2rem;
}

.crystal-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.crystal-svg {
  width: 90px;
  height: 90px;
  animation: crystalFloat 4s ease-in-out infinite;
  filter: drop-shadow(0 0 12px rgba(143,216,239,0.3));
}

@keyframes crystalFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  25%      { transform: translateY(-8px) rotate(3deg); }
  75%      { transform: translateY(4px) rotate(-2deg); }
}

.crystal-svg .main-line {
  stroke-dasharray: 360;
  stroke-dashoffset: 360;
  animation: drawCrystal 3.5s ease-in-out infinite alternate;
}

.crystal-svg .inner-line {
  stroke-dasharray: 240;
  stroke-dashoffset: 240;
  animation: drawCrystal 3.5s ease-in-out 0.6s infinite alternate;
}

.crystal-svg .core-line {
  stroke-dasharray: 80;
  stroke-dashoffset: 80;
  animation: drawCrystal 2.5s ease-in-out 1.2s infinite alternate;
}

@keyframes drawCrystal {
  0%   { stroke-dashoffset: 360; }
  60%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}

.crystal-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle,rgba(143,216,239,0.15),transparent 70%);
  animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
  0%,100% { opacity: 0.3; transform: scale(1); }
  50%      { opacity: 0.8; transform: scale(1.2); }
}

.loader-text-frost {
  font-family: var(--font-title);
  font-size: 1.3rem;
  background: linear-gradient(135deg,#8fd8ef,#c0f0ff,#ffe6b0,#8fd8ef);
  background-size: 300% 300%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: frostShift 4s ease infinite;
}

@keyframes frostShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.loader-dots {
  display: flex;
  gap: 6px;
  margin-top: 0.2rem;
}

.loader-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8fd8ef;
  animation: dotBounce 1.2s ease-in-out infinite;
}

.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotBounce {
  0%,100% { transform: translateY(0); opacity: 0.3; }
  50%      { transform: translateY(-8px); opacity: 1; }
}

.container { max-width: 1200px; margin: 0 auto; }

.page-header { position: relative; text-align: center; margin-bottom: 1.5rem; }

.nav-bar {
  display: flex;
  justify-content: center;
  gap: 0.6rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.nav-entry {
  padding: 0.7rem 1.6rem;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px) saturate(1.2);
  -webkit-backdrop-filter: blur(8px) saturate(1.2);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 1rem;
  color: rgba(230,245,255,0.8);
  font-size: 0.9rem;
  font-family: var(--font-sans);
  text-decoration: none;
  transition: background 0.25s,transform 0.25s,box-shadow 0.25s;
  box-shadow: 0 4px 16px -6px rgba(0,0,0,0.15);
}

.nav-entry:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.25);
}

.page-header h1 {
  font-size: clamp(1.8rem,5vw,2.8rem);
  font-weight: 400;
  font-family: var(--font-title);
  background: linear-gradient(135deg,#ffe6b0,#c0f0ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  line-height: 1.3;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

.page-header .sub {
  color: rgba(230,245,255,0.85);
  margin-top: 0.3rem;
  font-family: var(--font-mono);
  font-size: clamp(0.7rem,1.5vw,0.85rem);
  letter-spacing: 0.03em;
}

.page-header .sub a { color: var(--color-accent); text-decoration: none; transition: color 0.25s; }
.page-header .sub a:hover { color: #fff; }
.page-header .sub .dot { color: rgba(200,235,250,0.3); margin: 0 6px; }

.server-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
  gap: 1.2rem;
}

.server-card {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-card);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.08);
  overflow: hidden;
  transition: transform 0.25s,box-shadow 0.25s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

.server-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: rgba(0,0,0,0.55);
  z-index: -1;
  pointer-events: none;
}

.server-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px -16px rgba(0,0,0,0.5); }

.server-header {
  position: relative;
  z-index: 1;
  padding: 1.2rem 1.2rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.server-header.online  { background: linear-gradient(135deg,rgba(76,175,80,0.20),rgba(76,175,80,0.05)); }
.server-header.offline { background: linear-gradient(135deg,rgba(244,67,54,0.20),rgba(244,67,54,0.05)); }
.server-header.bedrock { background: linear-gradient(135deg,rgba(33,150,243,0.20),rgba(33,150,243,0.05)); }

.server-icon {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  background: rgba(255,255,255,0.12);
  padding: 3px;
  flex-shrink: 0;
  object-fit: cover;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: transform 0.25s;
}

.server-card:hover .server-icon { transform: scale(1.05); }

.server-name {
  font-size: clamp(1rem,2.5vw,1.15rem);
  font-weight: 600;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  flex: 1;
}

.server-status {
  padding: 4px 12px;
  border-radius: var(--radius-btn);
  font-size: 0.8rem;
  font-weight: 600;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
  white-space: nowrap;
}

.server-header.online .server-status  { background: rgba(76,175,80,0.30); }
.server-header.offline .server-status { background: rgba(244,67,54,0.30); }
.server-header.bedrock .server-status { background: rgba(33,150,243,0.30); }

.server-body {
  position: relative;
  z-index: 1;
  padding: 1rem 1.2rem 1.2rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.server-info { display: flex; align-items: baseline; gap: 0.5rem; }

.server-info label {
  font-size: 0.75rem;
  color: rgba(200,235,250,0.65);
  font-weight: 500;
  min-width: 60px;
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.server-info p,
.server-info .value { color: #e8f4fa; font-size: 0.9rem; font-family: var(--font-mono); word-break: break-all; }

.server-type-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.server-type-badge.java    { background: rgba(76,175,80,0.18); color: #81c784; }
.server-type-badge.bedrock { background: rgba(33,150,243,0.18); color: #64b5f6; }

.server-motd {
  background: rgba(0,0,0,0.15);
  backdrop-filter: blur(8px) saturate(1.2);
  -webkit-backdrop-filter: blur(8px) saturate(1.2);
  color: #ddf4ff;
  padding: 0.8rem 1rem;
  border-radius: 10px;
  margin-top: auto;
  font-size: 0.82rem;
  line-height: 1.5;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: break-word;
}

.no-servers {
  text-align: center;
  padding: 3rem 2rem;
  background: var(--glass-bg);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-card);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-card);
  color: rgba(200,235,250,0.70);
}

.no-servers h2 { color: #fff; margin-bottom: 0.5rem; font-weight: 500; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.40);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-content {
  width: 92%;
  max-width: 720px;
  max-height: 85vh;
  background: rgba(11,35,50,0.75);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-card);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  overflow: hidden;
  animation: modalIn 0.35s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 { font-size: 1.1rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 0.6rem; }

.modal-title-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: rgba(255,255,255,0.08); padding: 2px; flex-shrink: 0;
}

.modal-title-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

.close-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: rgba(255,255,255,0.5);
  width: 36px;
  height: 36px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  transition: background 0.25s,color 0.25s;
}

.close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

.modal-body { padding: 1.5rem; max-height: calc(85vh - 80px); overflow-y: auto; }
.modal-body .chart-wrapper { height: 280px; margin: 1.2rem 0; }

.modal-body::-webkit-scrollbar { width: 6px; }
.modal-body::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

.date-selector {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.8rem 1rem;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}

.date-selector label { color: rgba(200,235,250,0.7); font-size: 0.85rem; }

.date-input {
  padding: 6px 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 0.85rem;
  font-family: var(--font-mono);
  outline: none;
  transition: border 0.25s;
}

.date-input:focus { border-color: var(--color-accent); }
.date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

.status-error { color: #ef9a9a; text-align: center; padding: 1rem; }

.modal-note {
  text-align: center;
  color: rgba(200,235,250,0.40);
  font-size: 0.75rem;
  margin-top: 0.8rem;
  font-family: var(--font-mono);
}

.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #fff;
  padding: 0.7rem 1.6rem;
  border-radius: 2rem;
  font-size: 0.9rem;
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: var(--shadow-toast);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s,transform 0.3s;
  z-index: 999;
}

.toast.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}

/* ===== Admin Pages ===== */
.admin-page {
  min-height: 100vh;
  padding: var(--body-pad);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

.admin-container {
  max-width: 1000px;
  margin: 0 auto;
  background: var(--glass-bg);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-card);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.08);
  padding: 1.5rem;
  position: relative;
  z-index: 1;
}

.admin-container::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: rgba(0,0,0,0.55);
  z-index: -1;
  pointer-events: none;
}

.admin-page .header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.admin-page .header h1 {
  font-family: var(--font-title);
  font-weight: 400;
  font-size: clamp(1.3rem,3vw,1.8rem);
  background: linear-gradient(135deg,#ffe6b0,#c0f0ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.nav-links {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.nav-btn {
  padding: 0.5rem 1.2rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 1rem;
  color: rgba(230,245,255,0.8);
  font-size: 0.85rem;
  font-family: var(--font-sans);
  text-decoration: none;
  transition: background 0.25s,transform 0.25s;
  cursor: pointer;
  display: inline-block;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-2px);
}

.nav-btn.danger {
  color: #ef9a9a;
}

.form-container {
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius-item);
  padding: 1.2rem;
  margin-bottom: 1.5rem;
  border: 1px solid rgba(255,255,255,0.06);
}

.form-container h2 {
  font-family: var(--font-title);
  font-weight: 400;
  color: rgba(200,235,250,0.85);
  font-size: 1.15rem;
  margin-bottom: 1rem;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  color: rgba(200,235,250,0.7);
  font-size: 0.85rem;
  margin-bottom: 0.3rem;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 8px 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #e8f4fa;
  font-size: 0.9rem;
  font-family: var(--font-sans);
  outline: none;
  transition: border 0.25s;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--color-accent);
}

.form-group small {
  display: block;
  color: rgba(200,235,250,0.4);
  font-size: 0.75rem;
  margin-top: 0.2rem;
}

.btn {
  padding: 0.6rem 1.8rem;
  background: rgba(143,216,239,0.15);
  border: 1px solid rgba(143,216,239,0.25);
  border-radius: var(--radius-btn);
  color: #c0f0ff;
  font-size: 0.9rem;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background 0.25s,transform 0.25s;
}

.btn:hover {
  background: rgba(143,216,239,0.25);
  transform: translateY(-2px);
}

/* ===== Tables ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.5rem;
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

thead th {
  text-align: left;
  padding: 0.7rem 0.8rem;
  color: rgba(200,235,250,0.6);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

tbody td {
  padding: 0.6rem 0.8rem;
  color: #ddf4ff;
  font-size: 0.85rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  white-space: nowrap;
}

.action-btn {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 0.78rem;
  text-decoration: none;
  margin-right: 4px;
  transition: background 0.2s;
}

.edit-btn {
  background: rgba(33,150,243,0.15);
  color: #64b5f6;
}

.delete-btn {
  background: rgba(244,67,54,0.15);
  color: #ef9a9a;
}

.success, .error {
  padding: 0.6rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 1rem;
  border: 1px solid transparent;
}

.success {
  background: rgba(76,175,80,0.12);
  color: #81c784;
  border-color: rgba(76,175,80,0.15);
}

.error {
  background: rgba(244,67,54,0.12);
  color: #ef9a9a;
  border-color: rgba(244,67,54,0.15);
}

/* ===== Login ===== */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: var(--body-pad);
  font-family: var(--font-sans);
}

.login-container {
  width: 100%;
  max-width: 400px;
  background: var(--glass-bg);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border-radius: var(--radius-card);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.08);
  padding: 2rem 1.8rem;
  position: relative;
  z-index: 1;
}

.login-container::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: rgba(0,0,0,0.55);
  z-index: -1;
  pointer-events: none;
}

.login-container h1 {
  font-family: var(--font-title);
  font-weight: 400;
  font-size: 1.5rem;
  background: linear-gradient(135deg,#ffe6b0,#c0f0ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  text-align: center;
  margin-bottom: 1.2rem;
}

/* ===== Log List ===== */
.log-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.log-entry-line {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  padding: 0.5rem 0.8rem;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  font-size: 0.85rem;
  align-items: baseline;
}

.log-time {
  color: rgba(200,235,250,0.5);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  white-space: nowrap;
}

.log-message {
  color: #ddf4ff;
}

/* ===== API List ===== */
.api-list {
  margin-top: 0.5rem;
}

.api-item {
  padding: 0.7rem 1rem;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 0.4rem;
}

.api-info {
  color: #ddf4ff;
  font-size: 0.9rem;
}

.api-info small {
  color: rgba(200,235,250,0.5);
}

/* ===== Chart Standalone ===== */
.install-container.chart-standalone {
  padding: var(--body-pad);
}

.chart-controls {
  display: flex;
  align-items: center;
  margin-bottom: 1.5rem;
  padding: 0.8rem 1rem;
  background: rgba(255,255,255,0.05);
  border-radius: var(--radius-item);
  border: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
  gap: 1rem;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.control-group label {
  color: rgba(200,235,250,0.7);
  font-size: 0.85rem;
  white-space: nowrap;
}

.chart-btn {
  padding: 0.4rem 1.2rem;
  background: rgba(143,216,239,0.12);
  border: 1px solid rgba(143,216,239,0.2);
  border-radius: var(--radius-btn);
  color: #c0f0ff;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background 0.25s;
}

.chart-btn:hover {
  background: rgba(143,216,239,0.22);
}

.chart-wrapper {
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius-item);
  padding: 1rem;
  border: 1px solid rgba(255,255,255,0.06);
}

select.date-input option {
  background: #0b2b3b;
  color: #e8f4fa;
}

/* ===== Return links ===== */
.return-link {
  text-align: center;
  margin-top: 1rem;
}

.return-link a {
  color: var(--color-accent);
  font-size: 0.8rem;
  text-decoration: none;
}

.return-link a:hover {
  text-decoration: underline;
}

@media (max-width: 760px) {
  :root { --body-pad: 1.5rem; }
  .server-grid { grid-template-columns: 1fr; }
  .server-header { padding: 1rem 1rem 0.8rem; }
  .server-body { padding: 0.8rem 1rem 1rem; }
  .server-icon { width: 44px; height: 44px; }
}

@media (max-width: 520px) {
  :root { --body-pad: 1rem; }
  .server-grid { gap: 0.8rem; }
  .modal-content { width: 96%; border-radius: 1.5rem; }
  .modal-header { padding: 1rem; }
  .modal-header h3 { font-size: 0.95rem; }
  .modal-body { padding: 1rem; }
  .modal-body .chart-wrapper { height: 200px; }
  .date-selector { flex-direction: column; align-items: stretch; }
  .crystal-svg { width: 60px; height: 60px; }
  .loader-text-frost { font-size: 1rem; }
}

@media (orientation: portrait) and (max-width: 900px) {
  body { background-attachment: scroll; }
  .server-card { border-radius: 2.2rem; }
}

@media (hover: hover) {
  .server-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px -16px rgba(0,0,0,0.5); }
}

@media (prefers-color-scheme: dark) {
  #loader { background: linear-gradient(135deg,#0d1f2b,#142a38,#0d1f2b); background-size: 200% 200%; }
  body { background-color: #0b1a24; background-image: url(https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/status/138936740_p0.webp), linear-gradient(160deg,#0b1a24,#162b36); background-size: cover, auto; background-position: center, 0; background-repeat: no-repeat, repeat; background-attachment: fixed, scroll; }
  body::before { background: rgba(0,0,0,0.25); }
  .server-card::before { background: rgba(0,0,0,0.40); }
  .server-card { background: rgba(0,18,30,0.55); }
  .toast { background: rgba(0,0,0,0.80); border-color: rgba(255,255,255,0.06); }
  .page-header h1 { text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  .server-name { color: #d0e4f0; }
  .server-info p, .server-info .value { color: #8ab0c8; }
  .server-motd { color: #b0d0e0; }
  .modal-content { background: rgba(0,15,28,0.85); }
  .no-servers { background: rgba(0,18,30,0.55); }
  .admin-container { background: rgba(0,18,30,0.55); }
  .login-container { background: rgba(0,18,30,0.55); }
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .server-card:hover { transform: none !important; }
  #snowCanvas { display: none; }
  #loader { display: none; }
  body { background: var(--color-bg-deep); }
}

@media print {
  body { background: #fff !important; padding: 1rem; }
  body::before { display: none; }
  #loader { display: none; }
  #snowCanvas { display: none; }
  .server-card { background: #fafafa; backdrop-filter: none; border: 1px solid #ddd; box-shadow: none; }
  .server-header.online  { background: #e8f5e9; }
  .server-header.offline { background: #ffebee; }
  .server-header.bedrock { background: #e3f2fd; }
  .server-name, .server-info p, .server-motd { color: #333; }
  .server-status { color: #333; background: rgba(0,0,0,0.05); }
  .page-header h1 { background: none; color: #0b2b3b; }
  .modal-overlay { display: none !important; }
}
</style>
</head>
<body>
    <div class="install-container chart-standalone">
        <header class="page-header">
            <h1>在线人数历史记录</h1>
        </header>

        <div class="chart-controls" style="gap:1rem;flex-wrap:wrap;">
            <div class="control-group">
                <label for="serverSelect">选择服务器:</label>
                <select id="serverSelect" class="date-input">
                    <option value="0">生存服务器</option>
                    <option value="1">基岩互通服</option>
                </select>
            </div>
            <div class="control-group">
                <label>查看模式:</label>
                <select id="viewMode" class="date-input">
                    <option value="aggregated">聚合数据</option>
                    <option value="raw">原始数据</option>
                </select>
            </div>
            <button id="refreshBtn" class="chart-btn" style="font-size:0.85rem;">刷新</button>
        </div>

        <div class="chart-wrapper" style="height:400px;">
            <canvas id="historyChart"></canvas>
        </div>

        <p class="modal-note" id="dataInfo">* 静态演示数据</p>
        <p style="text-align:center;margin-top:1rem;"><a href="index.html" style="color:var(--color-accent);font-size:0.8rem;">返回主页</a></p>
    </div>

    <script>
    var datasets = {
        0: {
            aggregated: { labels: ['06-01','06-02','06-03','06-04','06-05','06-06'], values: [8,12,15,10,18,22] },
            raw: { labels: ['10:00','11:00','12:00','13:00','14:00','15:00','16:00'], values: [3,8,15,12,18,22,17] }
        },
        1: {
            aggregated: { labels: ['06-01','06-02','06-03','06-04','06-05','06-06'], values: [4,6,5,7,8,5] },
            raw: { labels: ['10:00','11:00','12:00','13:00','14:00','15:00'], values: [2,4,7,6,8,5] }
        }
    };

    var chart = null;
    function renderChart() {
        var sid = document.getElementById('serverSelect').value;
        var mode = document.getElementById('viewMode').value;
        var data = datasets[sid][mode];
        var ctx = document.getElementById('historyChart');

        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: '在线人数',
                    data: data.values,
                    borderColor: '#8fd8ef',
                    backgroundColor: 'rgba(143,216,239,0.15)',
                    borderWidth: 2,
                    pointBackgroundColor: '#8fd8ef',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointRadius: 4,
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: 'rgba(255,255,255,0.7)' } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.5)', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
        document.getElementById('dataInfo').textContent = '数据点: ' + data.values.length + ' | 演示数据';
    }

    document.getElementById('serverSelect').addEventListener('change', renderChart);
    document.getElementById('viewMode').addEventListener('change', renderChart);
    document.getElementById('refreshBtn').addEventListener('click', function() {
        datasets[0].aggregated.values = Array.from({length:6},function(){return Math.floor(Math.random()*20)+3});
        datasets[0].raw.values = Array.from({length:7},function(){return Math.floor(Math.random()*20)+3});
        datasets[1].aggregated.values = Array.from({length:6},function(){return Math.floor(Math.random()*8)+2});
        datasets[1].raw.values = Array.from({length:6},function(){return Math.floor(Math.random()*8)+2});
        renderChart();
    });
    renderChart();
    </script>
</body>
