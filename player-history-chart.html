<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线人数历史 · SnowBlock</title>
    <link rel="stylesheet" href="assets/vendor/fonts/ZCOOL_KuaiLe.css">
    <link rel="stylesheet" href="assets/vendor/font-awesome@6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    try {
      var savedTheme = localStorage.getItem('theme')
      var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="loader">
        <div class="loader-crystal">
            <div class="crystal-wrapper">
                <div class="crystal-glow"></div>
                <svg class="crystal-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path class="main-line" stroke-width="2.2" stroke-linecap="round" fill="none"
                          d="M50 5 L50 95
                             M50 5 L75 25 L50 50
                             M50 5 L25 25 L50 50
                             M50 95 L75 75 L50 50
                             M50 95 L25 75 L50 50
                             M50 50 L95 50
                             M75 25 L95 50
                             M25 25 L5 50
                             M75 75 L95 50
                             M25 75 L5 50" />
                    <path class="inner-line" stroke-width="1.4" stroke-linecap="round" fill="none"
                          d="M50 15 L50 85
                             M50 15 L65 30 L50 50
                             M50 15 L35 30 L50 50
                             M50 85 L65 70 L50 50
                             M50 85 L35 70 L50 50
                             M50 50 L85 50
                             M65 30 L85 50
                             M35 30 L15 50
                             M65 70 L85 50
                             M35 70 L15 50" />
                    <path class="core-line" stroke-width="1.8" stroke-linecap="round" fill="none"
                          d="M50 38 L50 62
                             M50 38 L57 44 L50 50
                             M50 38 L43 44 L50 50
                             M50 62 L57 56 L50 50
                             M50 62 L43 56 L50 50
                             M50 50 L62 50
                             M57 44 L62 50
                             M43 44 L38 50
                             M57 56 L62 50
                             M43 56 L38 50" />
                </svg>
            </div>
            <div class="loader-text-frost"><i class="fa-solid fa-snowflake"></i> 正在连接雪境</div>
            <div class="loader-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
    <canvas id="snowCanvas"></canvas>
    <div id="toast" class="toast"></div>
    <div class="install-container chart-standalone">
        <header class="page-header">
            <h1>在线人数历史记录</h1>
            <p class="sub">浏览器本地采样 · 保留 7 天</p>
        </header>

        <div class="chart-controls" style="gap:1rem;flex-wrap:wrap;">
            <div class="control-group">
                <label for="serverSelect">选择服务器:</label>
                <select id="serverSelect" class="date-input"></select>
            </div>
            <div class="control-group">
                <label>查看模式:</label>
                <select id="viewMode" class="date-input">
                    <option value="aggregated">聚合数据(按天)</option>
                    <option value="raw">原始数据(按时段)</option>
                </select>
            </div>
            <button id="refreshBtn" class="chart-btn" style="font-size:0.85rem;">刷新</button>
        </div>

        <div class="chart-wrapper" style="height:400px;">
            <canvas id="historyChart"></canvas>
        </div>

        <p class="modal-note" id="dataInfo">* 暂无本地采样数据,请先在主页停留让状态页采样</p>
        <p style="text-align:center;margin-top:1rem;"><a href="index.html" style="color:var(--color-accent);font-size:0.8rem;">返回主页</a></p>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/servers.js"></script>
    <script src="assets/js/admin-config.js"></script>
    <script src="assets/js/status.js"></script>
    <script>
    var chart = null;

    var select = document.getElementById('serverSelect');
    var servers = (typeof AdminConfig !== 'undefined') ? AdminConfig.servers() : SERVERS;
    servers.forEach(function (srv) {
        var opt = document.createElement('option');
        opt.value = srv.id;
        opt.textContent = srv.name;
        select.appendChild(opt);
    });

    function renderChart() {
        var sid = select.value;
        var mode = document.getElementById('viewMode').value;
        var hist = mcStatus.loadHistory(sid);
        var ctx = document.getElementById('historyChart');
        if (chart) chart.destroy();

        var series;
        if (hist.length) {
            series = mode === 'aggregated' ? mcStatus.aggregateByDay(hist) : mcStatus.aggregateByHour(hist);
        } else {
            series = { labels: [], values: [] };
        }

        if (!series.labels.length) {
            document.getElementById('dataInfo').textContent = '* 暂无本地采样数据,请在主页停留让状态页采样(每 60s 记录一点)';
            document.getElementById('dataInfo').style.color = 'var(--status-warning)';
            return;
        }

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: series.labels,
                datasets: [{
                    label: '在线人数',
                    data: series.values,
                    borderColor: '#8fd8ef',
                    backgroundColor: 'rgba(143,216,239,0.15)',
                    borderWidth: 2,
                    pointBackgroundColor: '#8fd8ef',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointRadius: 3,
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: 'var(--chart-tick)' } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { ticks: { color: 'var(--chart-tick)' }, grid: { color: 'var(--chart-grid)' } },
                    y: { beginAtZero: true, ticks: { color: 'var(--chart-tick)', stepSize: 1 }, grid: { color: 'var(--chart-grid)' } }
                }
            }
        });
        document.getElementById('dataInfo').textContent = '数据点: ' + hist.length + ' | 浏览器本地采样(每 60s 一点)';
        document.getElementById('dataInfo').style.color = '';
    }
    document.getElementById('serverSelect').addEventListener('change', renderChart);
    document.getElementById('viewMode').addEventListener('change', renderChart);
    document.getElementById('refreshBtn').addEventListener('click', renderChart);
    renderChart();
    </script>
</body>
</html>
