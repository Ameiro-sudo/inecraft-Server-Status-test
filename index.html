<body>

<!-- ===== 加载层 ===== -->

                      fill="none"
                      d="M50 5 L50 95
                         M50 5 L75 25 L50 50
                         M50 5 L25 25 L50 50
                         M50 95 L75 75 L50 50
                         M50 95 L25 75 L50 50
                         M50 50 L95 50
                         M75 25 L95 50
                         M25 25 L5 50
                         M75 75 L95 50
                         M25 75 L5 50" />
                <path class="inner-line" stroke="#c0f0ff" stroke-width="1.4" stroke-linecap="round"
                      fill="none"
                      d="M50 15 L50 85
                         M50 15 L65 30 L50 50
                         M50 15 L35 30 L50 50
                         M50 85 L65 70 L50 50
                         M50 85 L35 70 L50 50
                         M50 50 L85 50
                         M65 30 L85 50
                         M35 30 L15 50
                         M65 70 L85 50
                         M35 70 L15 50" />
                <path class="core-line" stroke="#ffe6b0" stroke-width="1.8" stroke-linecap="round"
                      fill="none"
                      d="M50 38 L50 62
                         M50 38 L57 44 L50 50
                         M50 38 L43 44 L50 50
                         M50 62 L57 56 L50 50
                         M50 62 L43 56 L50 50
                         M50 50 L62 50
                         M57 44 L62 50
                         M43 44 L38 50
                         M57 56 L62 50
                         M43 56 L38 50" />
            </svg>
        </div>
        <div class="loader-text-frost">❄️ 正在连接雪境</div>

            <span></span><span></span><span></span>
        </div>
    </div>
</div>

<canvas id="snowCanvas" aria-hidden="true"></canvas>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="container">
    <header class="page-header">
        <h1>Minecraft 服务器</h1>
        <p class="sub">
            <a href="login.html">管理面板</a>
            <span class="dot">·</span>
            <a href="player-history-chart.html">历史图表</a>
            <span class="dot">·</span>
            <a href="https://snowblock.top">SnowBlock</a>
            <span class="dot">·</span>
            静态演示
        </p>
    </header>

    <div class="server-grid">
        <div class="server-card" data-server-id="1">
            <div class="server-header online">
                <div class="server-icon" style="display:flex;align-items:center;justify-content:center;font-size:1.8rem;">SV</div>
                <div class="server-name">示例生存服</div>
                <div class="server-status">在线</div>
            </div>
            <div class="server-body">
                <div class="server-info"><label>地址</label><p>play.example.com</p></div>
                <div class="server-info"><label>类型</label><span class="server-type-badge java">Java</span></div>
                <div class="server-info"><label>人数</label><p>12 / 20</p></div>
                <div class="server-info"><label>版本</label><p>1.20.4</p></div>
                <div class="server-motd">欢迎来到 示例服务器  Enjoy!</div>
            </div>
        </div>

        <div class="server-card" data-server-id="2">
            <div class="server-header offline">
                <div class="server-icon" style="display:flex;align-items:center;justify-content:center;font-size:1.8rem;">OF</div>
                <div class="server-name">离线测试服</div>
                <div class="server-status">离线</div>
            </div>
            <div class="server-body">
                <div class="server-info"><label>地址</label><p>offline.example.com</p></div>
                <div class="server-info"><label>类型</label><span class="server-type-badge java">Java</span></div>
                <div class="server-motd" style="color:rgba(200,235,250,0.4);">服务器无法连接</div>
            </div>
        </div>

        <div class="server-card" data-server-id="3">
            <div class="server-header online bedrock">
                <div class="server-icon" style="display:flex;align-items:center;justify-content:center;font-size:1.8rem;">BE</div>
                <div class="server-name">基岩互通服</div>
                <div class="server-status">在线</div>
            </div>
            <div class="server-body">
                <div class="server-info"><label>地址</label><p>bedrock.example.com:19132</p></div>
                <div class="server-info"><label>类型</label><span class="server-type-badge bedrock">基岩</span></div>
                <div class="server-info"><label>人数</label><p>5 / 10</p></div>
                <div class="server-info"><label>版本</label><p>1.20.30</p></div>
                <div class="server-motd">基岩版生存 欢迎加入</div>
            </div>
        </div>
    </div>
</div>

<div id="chartModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">服务器在线人数历史数据</h3>
            <button id="closeModal" class="close-btn" aria-label="关闭">x</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script src="assets/js/app.js" defer></script>

<script>
!function(){
var l=document.getElementById('loader'),i=new Image,b=!1,m=!1;
i.src='https://raw.githubusercontent.com/ninasukiwww-png/my-images/main/status/138936740_p0.webp';
i.onload=function(){b=!0;f()};
i.onerror=function(){b=!0;f()};
setTimeout(function(){m=!0;f()},1500);
setTimeout(function(){if(!l.classList.contains('hidden')){b=!0;m=!0;f()}},5000);
function f(){if(b&&m&&!l.classList.contains('hidden')){l.classList.add('hidden');document.body.classList.add('bg-loaded');l.addEventListener('transitionend',function(){l.style.display='none'},{once:true})}}
var n=document.getElementById('snowCanvas'),t=n.getContext('2d'),p=[],w,h;
function rs(){w=n.width=innerWidth;h=n.height=innerHeight}
function cp(){return{x:Math.random()*w,y:Math.random()*h-20,r:Math.random()*2.4+1,s:Math.random()*.6+.2,w:Math.random()*.3-.12,a:Math.random()*.4+.15}}
function is(){p=Array.from({length:window.innerWidth<768?30:60},cp)}
function ds(){t.clearRect(0,0,w,h);for(var e=0;e<p.length;e++){var o=p[e];t.beginPath(),t.arc(o.x,o.y,o.r,0,Math.PI*2),t.fillStyle='rgba(255,255,255,'+o.a+')',t.fill(),o.y+=o.s,o.x+=o.w,o.y>h+25&&(p[e]=cp()),o.x>w+20?o.x=-15:o.x<-20&&(o.x=w+10)}for(;p.length<(window.innerWidth<768?40:60);)p.push(cp());requestAnimationFrame(ds)}
addEventListener('resize',rs);rs();is();ds();
}();
</script>
</body>
