<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 服务器状态</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ========== 原样式完整保留 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        
        h1 a {
            color: inherit;
            text-decoration: none;
        }
        
        .login-link {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .login-link a {
            color: #2196F3;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .login-link a:hover {
            background-color: #2196F3;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(33, 150, 243, 0.3);
        }
        
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .server-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: visible;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 1px solid #e0e0e0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
            cursor: pointer;
        }
        
        .server-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .server-header {
            padding: 15px;
            color: white;
            display: flex;
            align-items: center;
            min-height: 80px;
            transition: background-color 0.3s ease;
        }
        
        .server-header.online {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        
        .server-header.offline {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
        }
        
        .server-header.bedrock {
            background: linear-gradient(135deg, #2196F3 0%, #0b7dda 100%);
        }
        
        .server-icon {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            margin-right: 15px;
            background-color: #fff;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        
        .server-card:hover .server-icon {
            transform: scale(1.05);
        }
        
        .server-name {
            font-size: 18px;
            font-weight: bold;
            flex: 1;
        }
        
        .server-status {
            margin-left: auto;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .server-body {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .server-info {
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .server-card:hover .server-info {
            transform: translateX(5px);
        }
        
        .server-info label {
            font-weight: bold;
            color: #666;
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .server-info p {
            margin: 0;
            color: #333;
            font-size: 1.05em;
        }
        
        .server-type-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            margin-top: 5px;
        }
        
        .server-type-badge.java {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .server-type-badge.bedrock {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .server-motd {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
            margin-bottom: 0;
            font-style: normal;
            line-height: 1.6;
            white-space: normal;
            overflow-wrap: break-word;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
            border: 1px solid #1a252f;
            height: 80px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .player-list {
            display: none;
        }
        
        .copy-ip-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        
        .copy-ip-btn:hover {
            background-color: #1976D2;
            transform: translateY(-1px);
        }
        
        .copy-ip-btn.copied {
            background-color: #4CAF50;
        }
        
        .no-servers {
            text-align: center;
            padding: 60px 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 40px;
        }
        
        .no-servers h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .no-servers p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        @media (max-width: 768px) {
            .server-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2em;
            }
            .container {
                padding: 10px;
            }
        }
        
        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            margin: 0;
            color: #333;
            display: flex;
            align-items: center;
        }
        
        .modal-title-icon {
            display: inline-flex;
            align-items: center;
            margin-right: 8px;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background-color: #fff;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .close-btn:hover {
            background-color: #f0f0f0;
            color: #333;
        }
        
        .modal-body {
            padding: 20px;
            max-height: calc(80vh - 120px);
            overflow-y: auto;
        }
        
        .modal-body .chart-wrapper {
            height: 300px;
            margin: 20px 0;
        }
        
        .modal-body .chart-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .date-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .date-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .status-error {
            color: #f44336;
            text-align: center;
            padding: 20px;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1><a href="#">Minecraft 服务器状态（只是演示没有后端</a></h1>
    
    <!-- 静态示例服务器列表 -->
    <div class="server-grid">
        <!-- 卡片 1：在线 Java 服务器 -->
        <div class="server-card" data-server-id="1">
            <div class="server-header online">
                <img src="https://via.placeholder.com/64?text=MC" alt="Server Icon" class="server-icon">
                <div class="server-name">示例生存服</div>
                <div class="server-status">在线</div>
            </div>
            <div class="server-body">
                <div class="server-info">
                    <label>地址</label>
                    <p>play.example.com</p>
                </div>
                <div class="server-info">
                    <label>类型</label>
                    <span class="server-type-badge java">Java</span>
                </div>
                <div class="server-info">
                    <label>在线人数</label>
                    <p>12 / 20</p>
                </div>
                <div class="server-info">
                    <label>版本</label>
                    <p>1.20.4</p>
                </div>
                <div class="server-motd">
                    §a欢迎来到 §l示例服务器§r §eEnjoy!
                </div>
            </div>
        </div>
        
        <!-- 卡片 2：离线服务器 -->
        <div class="server-card" data-server-id="2">
            <div class="server-header offline">
                <div class="server-icon" style="background:#ccc;"></div>
                <div class="server-name">离线测试服</div>
                <div class="server-status">离线</div>
            </div>
            <div class="server-body">
                <div class="server-info">
                    <label>地址</label>
                    <p>offline.example.com</p>
                </div>
                <div class="server-info">
                    <label>类型</label>
                    <span class="server-type-badge java">Java</span>
                </div>
                <div class="server-motd">
                    服务器无法连接
                </div>
            </div>
        </div>
        
        <!-- 卡片 3：基岩版在线 -->
        <div class="server-card" data-server-id="3">
            <div class="server-header online bedrock">
                <img src="https://via.placeholder.com/64?text=BE" alt="Server Icon" class="server-icon">
                <div class="server-name">基岩互通服</div>
                <div class="server-status">在线</div>
            </div>
            <div class="server-body">
                <div class="server-info">
                    <label>地址</label>
                    <p>bedrock.example.com:19132</p>
                </div>
                <div class="server-info">
                    <label>类型</label>
                    <span class="server-type-badge bedrock">基岩</span>
                </div>
                <div class="server-info">
                    <label>在线人数</label>
                    <p>5 / 10</p>
                </div>
                <div class="server-info">
                    <label>版本</label>
                    <p>1.20.30</p>
                </div>
                <div class="server-motd">
                    §b基岩版生存 §a欢迎加入
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 图表模态框（结构保留） -->
<div id="chartModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">服务器在线人数历史数据</h3>
            <button id="closeModal" class="close-btn">×</button>
        </div>
        <div id="modalBody" class="modal-body">
            <!-- 动态内容 -->
        </div>
    </div>
</div>

<script>
    // ========== 静态演示：模拟图表数据，无后端请求 ==========
    (function() {
        // 获取元素
        const chartModal = document.getElementById('chartModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModal');
        
        let currentModalChart = null;
        
        // 关闭模态框
        function hideChartModal() {
            if (chartModal) chartModal.style.display = 'none';
        }
        
        // 显示模态框并展示模拟图表
        function showChartModal(serverId, serverName) {
            if (!chartModal || !modalBody) return;
            
            // 获取服务器图标（从卡片中）
            const card = document.querySelector(`.server-card[data-server-id="${serverId}"]`);
            let iconHtml = '';
            if (card) {
                const iconImg = card.querySelector('.server-icon');
                if (iconImg && iconImg.tagName === 'IMG') {
                    iconHtml = `<div class="modal-title-icon"><img src="${iconImg.src}" style="width:100%;height:100%;object-fit:cover;"></div>`;
                }
            }
            modalTitle.innerHTML = iconHtml + serverName + ' - 在线人数历史数据（模拟）';
            
            // 清空并填充模拟图表内容
            modalBody.innerHTML = `
                <div class="date-selector">
                    <label>选择日期（模拟）：</label>
                    <input type="date" id="mockDate" class="date-input" value="${new Date().toISOString().split('T')[0]}">
                </div>
                <div class="chart-wrapper">
                    <canvas id="modalPlayerChart" width="400" height="300"></canvas>
                </div>
                <p style="text-align:center; color:#888; margin-top:10px;">* 静态演示数据，非真实服务器状态</p>
            `;
            
            // 初始化模拟图表
            const ctx = document.getElementById('modalPlayerChart');
            if (ctx && typeof Chart !== 'undefined') {
                if (currentModalChart) currentModalChart.destroy();
                // 生成模拟数据（最近6个时间点）
                const labels = ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00'];
                const values = [3, 8, 15, 12, 18, 22];
                currentModalChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '在线人数',
                            data: values,
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { mode: 'index', intersect: false }
                        }
                    }
                });
            } else {
                modalBody.innerHTML += '<p class="status-error">Chart.js 加载失败，无法显示图表。</p>';
            }
            
            chartModal.style.display = 'flex';
        }
        
        // 绑定卡片点击事件
        const cards = document.querySelectorAll('.server-card');
        cards.forEach(card => {
            const serverId = card.getAttribute('data-server-id');
            const serverName = card.querySelector('.server-name')?.innerText || '服务器';
            card.addEventListener('click', (e) => {
                // 避免点到内部按钮导致冒泡（这里没有内部按钮，直接触发）
                showChartModal(serverId, serverName);
            });
        });
        
        // 关闭按钮
        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', hideChartModal);
        }
        if (chartModal) {
            chartModal.addEventListener('click', (e) => {
                if (e.target === chartModal) hideChartModal();
            });
        }
        // ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideChartModal();
        });
        
        // 日期选择器变化时重新生成模拟数据（简单演示，不实际请求）
        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'mockDate') {
                if (currentModalChart) {
                    // 随机生成一些假数据
                    const newValues = Array.from({length: 6}, () => Math.floor(Math.random() * 30));
                    currentModalChart.data.datasets[0].data = newValues;
                    currentModalChart.update();
                }
            }
        });
    })();
</script>
</body>
</html>
