<script>
(function() {
    var loader = document.getElementById('loader');
    var bgImg = new Image();
    bgImg.src = 'https://snowblock.top/138936740_p0.webp';
    var loaded = false;
    var minDelay = false;

    function check() {
        if (!loaded || !minDelay) return;
        loader.classList.add('hidden');
        setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 600);
    }

    bgImg.onload = function() { loaded = true; check(); };
    bgImg.onerror = function() { loaded = true; check(); };
    if (bgImg.complete) loaded = true;
    setTimeout(function() { minDelay = true; check(); }, 1500);
    setTimeout(function() { loaded = true; minDelay = true; check(); }, 5000);

    var canvas = document.getElementById('snowCanvas');
    if (canvas) {
        var ctx = canvas.getContext('2d');
        var particles = [];
        var w, h;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        var MAX_PARTICLES = window.innerWidth < 768 ? 30 : 60;

        function create() {
            return {
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 2.5 + 1.2,
                speed: Math.random() * 0.6 + 0.15,
                wind: Math.random() * 0.3 - 0.15,
                alpha: Math.random() * 0.35 + 0.15
            };
        }

        for (var i = 0; i < MAX_PARTICLES; i++) particles.push(create());

        function draw() {
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + p.alpha + ')';
                ctx.fill();
                p.y += p.speed;
                p.x += p.wind;
                if (p.y > h + 10) particles[i] = create();
                if (p.x > w + 10) p.x = -10;
                if (p.x < -10) p.x = w + 10;
            }
            while (particles.length < MAX_PARTICLES) particles.push(create());
            requestAnimationFrame(draw);
        }
        draw();
    }
})();
</script>
